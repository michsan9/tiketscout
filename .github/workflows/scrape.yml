# Simpan sebagai: .github/workflows/scrape.yml
name: scrape-tiket
on:
  schedule:
    # Target hasil segar (WITA, UTC+8): 00:00, 03:00, 06:00, 09:00, 12:00, 16:00, 19:00, 22:00. GitHub memakai UTC, jadi ditulis -8 jam:
    - cron: '47 15,18,21,0,3,7,10,13 * * *'     # dimulai :47 SEBELUM jam target (= 23:47 WITA utk 00:00, dst) karena GitHub biasanya telat 5-20 mnt & menit :00 paling padat
    # CADANGAN: GitHub kadang menghilangkan satu pemicu jadwal begitu saja. Pemicu kedua 30 menit kemudian; bila ada run aktif atau run sukses selesai <60 menit lalu, langkah 'Cek jarak' membatalkannya sendiri.
    - cron: '17 16,19,22,1,4,8,11,14 * * *'
  workflow_dispatch:
    inputs:
      cek:
        description: 'Uji cepat 1 rute di semua OTA (kosongkan untuk pencarian penuh). Contoh: DPS CGK 2027-03-05 | SUB KUL 2027-03-05 | url https://situs-ota-lain/pencarian-yang-Anda-salin'
        required: false
        default: ''
concurrency:
  group: scrape-tiket              # tidak boleh dua run bersamaan; run berikutnya antre
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Jeda antar-run (minimal 60 menit sejak run sebelumnya SELESAI)
        id: guard
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JARAK_MENIT: ${{ vars.JARAK_MENIT || '60' }}
        run: |
          R="repos/${{ github.repository }}/actions"
          mulai=$(date -u -d "$(gh api $R/runs/${{ github.run_id }} --jq .created_at)" +%s)
          # run lain yang masih aktif -> run ini duplikat, batalkan
          aktif=$(gh api "$R/workflows/scrape.yml/runs?per_page=30" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status == \"in_progress\")] | length")
          # waktu selesai run sukses terakhir (epoch)
          akhir=$(gh api "$R/workflows/scrape.yml/runs?per_page=30" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status == \"completed\" and .conclusion == \"success\") | .updated_at] | sort | last // empty")
          akhir=$( [ -n "$akhir" ] && date -u -d "$akhir" +%s || echo 0 )
          now=$(date -u +%s); tunggu=$(( akhir + JARAK_MENIT*60 - now ))
          echo "aktif=$aktif, run terakhir selesai $(( (now-akhir)/60 )) menit lalu, perlu tunggu ${tunggu}s"
          if [ "${aktif:-0}" -gt 0 ]; then batal=1
          elif [ "$tunggu" -gt 0 ] && [ "$akhir" -ge "$mulai" ]; then batal=1     # run sebelumnya selesai SETELAH run ini dipicu = pemicu ganda dari jadwal yang sama
          else batal=0; fi
          if [ "$batal" = 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Dilewati (duplikat). Run dibatalkan."
            gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true; sleep 20
          elif [ "$tunggu" -gt 0 ]; then
            echo "Menunggu ${tunggu}s agar jeda $JARAK_MENIT menit terpenuhi, lalu jalan."; sleep "$tunggu"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with: { python-version: '3.12' }
      - if: steps.guard.outputs.skip != 'true'
        run: pip install playwright && playwright install --with-deps chromium
      - name: Scraping
        if: steps.guard.outputs.skip != 'true'
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          CEK: ${{ github.event.inputs.cek }}
          TGL_MULAI: ${{ vars.TGL_MULAI }}         # opsional; kosong = 2027-02-26. Bila Anda pernah mengisi variabel ini, hapus atau ganti ke 2027-02-26
          TGL_AKHIR: ${{ vars.TGL_AKHIR }}         # opsional; kosong = 2027-03-31
          WORKERS: ${{ vars.WORKERS }}             # opsional: jumlah halaman dibaca bersamaan (default 12; turunkan ke 8 bila runner kehabisan memori)
          SOFT_MENIT: ${{ vars.SOFT_MENIT }}       # opsional: batas lunak pencarian (menit, default 270 = praktis tanpa batas), lalu hasil dihitung & dikirim; dibatasi hanya agar tidak melewati batas job 360 menit
          OTA_TAMBAHAN: ${{ vars.OTA_TAMBAHAN }}   # opsional: OTA lain, JSON mis. {"namasitus":"https://...{o}...{iso}"} (lihat isi_templat di tiketscout.py)
          OTA_SEMUA: ${{ vars.OTA_SEMUA }}         # opsional: 1 = baca SEMUA OTA per rute-tanggal (lebih lama)
          FLIGHT_SITES: ${{ vars.FLIGHT_SITES }}   # opsional: daftar sumber, mis. trip,google (tanpa agoda bila selalu minta verifikasi anti-bot); kosong = trip,agoda,google
          DPS_PKU: ${{ vars.DPS_PKU }}             # opsional: 1 = tambahkan tiket tunggal DPS->PKU (transit dipilihkan OTA)
          KURS_MYR_IDR: ${{ vars.KURS_MYR_IDR }}   # opsional: kurs MYR->IDR buatan Anda sendiri (bila situs maskapai tampil ringgit)
          KURS_SGD_IDR: ${{ vars.KURS_SGD_IDR }}   # opsional: kurs SGD->IDR buatan Anda sendiri
          KURS_USD_IDR: ${{ vars.KURS_USD_IDR }}   # opsional: kurs USD->IDR buatan Anda sendiri (untuk Agoda bila tampil USD); kosong = tidak dikonversi
        run: |
          set -f   # cegah '?' dan '*' pada URL diperlakukan sebagai pola file
          if [ -n "$CEK" ]; then python -u tiketscout.py cek $CEK; else python -u tiketscout.py once; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: |
            gagal_*.png
            cek_*.png
            teks_*.txt
          if-no-files-found: ignore
          retention-days: 1              # hapus otomatis setelah 1 hari agar kuota penyimpanan GitHub tidak penuh (bawaan 90 hari)
      - name: Jaga jadwal tetap aktif (GitHub menonaktifkan cron repo publik setelah 60 hari tanpa aktivitas)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable scrape.yml --repo ${{ github.repository }}
